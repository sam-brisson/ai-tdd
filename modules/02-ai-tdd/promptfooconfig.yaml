# Thanksgiving Drink Pairing - AI Test Suite
# =============================================
#
# These tests are derived from OpenSpec acceptance criteria.
# See: openspec/changes/drink-pairing-feature/tasks.md
#
# TDD Cycle:
#   1. Run tests (should be GREEN - baseline)
#   2. Add new test via OpenSpec (RED - it will fail)
#   3. Edit system-prompt.txt (GREEN - make it pass)
#
# Run tests: npm test
# View results: npm run view

description: "Thanksgiving Drink Pairing Tests"

# Reduce concurrency to avoid rate limits on free tier
evaluateOptions:
  maxConcurrency: 1

prompts:
  - file://system-prompt.txt

providers:
  - id: groq:openai/gpt-oss-20b

# Use Groq for grading llm-rubric assertions
defaultTest:
  options:
    provider:
      id: groq:openai/gpt-oss-120b
  vars:
    prompt: |
      Menu: {{menu}}
      {{#if restrictions}}Dietary notes: {{restrictions}}{{/if}}

      Please suggest drink pairings for this meal.

tests:
  # ============================================
  # CORE FUNCTIONALITY
  # OpenSpec: drink-pairing-feature/tasks.md
  # ============================================

  # OpenSpec: "Suggests wine for turkey"
  - description: "Suggests wine for traditional turkey dinner"
    vars:
      menu: "Roasted Turkey, Mashed Potatoes, Cranberry Sauce"
    assert:
      - type: llm-rubric
        value: "Suggests at least one wine variety (such as Pinot Noir or Chardonnay)"

  # OpenSpec: "Offers beer alternatives"
  - description: "Offers beer as an alternative"
    vars:
      menu: "Turkey, Stuffing, Pumpkin Pie"
    assert:
      - type: llm-rubric
        value: "Includes at least one beer suggestion"

  # OpenSpec: "Suggests non-alcoholic options"
  - description: "Includes non-alcoholic options when requested"
    vars:
      menu: "Turkey, Stuffing, Gravy"
      restrictions: "Some guests don't drink alcohol"
    assert:
      - type: llm-rubric
        value: "Includes at least one non-alcoholic beverage suggestion"

  # OpenSpec: "Explains why pairings work"
  - description: "Explains why the pairing works"
    vars:
      menu: "Honey-Glazed Ham, Sweet Potatoes"
    assert:
      - type: llm-rubric
        value: "Provides a brief explanation of why the suggested drink complements the food"

  # OpenSpec: "Warm and welcoming tone"
  - description: "Warm and welcoming tone"
    vars:
      menu: "Turkey dinner - first time hosting!"
    assert:
      - type: llm-rubric
        value: "Response is warm and encouraging"
